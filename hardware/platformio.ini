; Deskbot — XIAO ESP32S3 Sense
; 烧录: ./flash_rom.sh all
; 需要: PlatformIO 跑在 Python ≥3.10（推荐 hardware/.venv + python3.11）
;
; WiFi / WS: firmware/deskbot_config.h

[platformio]
src_dir = firmware

[env:deskbot_rom_common]
build_flags =
	-DBOARD_HAS_PSRAM
	-DWEBSOCKETS_MAX_DATA_SIZE=1048576
	; 同时用于 WebSocket HTTP 升级响应等待；5 秒会在服务端瞬时繁忙时制造重连风暴。
	-DWEBSOCKETS_TCP_TIMEOUT=15000
	-DWEBSOCKETS_TCP_WRITE_TIMEOUT=5000

[env:seeed_xiao_esp32s3]
extends = env:deskbot_rom_common
; Arduino-ESP32 3.3.9 + ESP-IDF 5.5.4（官方 PlatformIO 仍卡在 Arduino 2.0.17 / IDF 4.4.7）
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions/deskbot_rom_8MB.csv
extra_scripts =
	pre:scripts/patch_websockets_max_data.py
	pre:scripts/patch_websockets_write_timeout_define.py
	pre:scripts/patch_websockets_write_deadline.py
	pre:scripts/unpatch_websockets_write_pump.py
	pre:scripts/patch_wifi_client_write_timeout.py
	pre:scripts/unpatch_wifi_client_write_pump.py
board_build.sdkconfig_defaults =
	firmware/sdkconfig.defaults
lib_ldf_mode = deep
build_flags =
	${env:deskbot_rom_common.build_flags}
	-DCONFIG_ESP_CONSOLE_NONE=1
	; loop 已无 Opus；encode=mic(40KB) decode=pb_runtime(32KB)。与 getArduinoLoopTaskStackSize 对齐。
	-DARDUINO_LOOP_STACK_SIZE=24576
lib_deps =
	https://github.com/sh123/esp32_opus_arduino.git
	links2004/WebSockets@^2.6.1
	adafruit/Adafruit ST7735 and ST7789 Library
	adafruit/Adafruit GFX Library
	adafruit/Adafruit BusIO
	bblanchon/ArduinoJson@^7
	bitbank2/JPEGDEC@^1.8.2
	; U8g2_for_Adafruit_GFX 自带 u8g2_fonts；勿再依赖完整 U8g2（GCC14 会 multiple definition）
	https://github.com/olikraus/U8g2_for_Adafruit_GFX.git
	madhephaestus/ESP32Servo
lib_ignore =
	U8g2
